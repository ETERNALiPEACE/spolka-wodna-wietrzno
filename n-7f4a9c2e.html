<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel administracyjny — Spółka Wodna Wietrzno</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#ffffff" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,500;7..72,700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=54" />
  <link rel="stylesheet" href="n-7f4a9c2e.css?v=60" />
</head>
<body class="admin-body">

  <main class="admin-shell">
    <header class="admin-header">
      <p class="brand-mark">Panel administracyjny</p>
      <a class="btn btn-ghost admin-back admin-back--editor" href="index.html#news">Wróć do strony</a>
    </header>

    <section id="login-panel" class="panel-inner admin-card">
      <h2>Logowanie</h2>
      <form id="login-form" class="admin-login-form">
        <div class="field">
          <label for="admin-login">Login</label>
          <input id="admin-login" name="login" type="text" required autocomplete="username" />
        </div>
        <div class="field">
          <label for="admin-password">Hasło</label>
          <input id="admin-password" name="password" type="password" required autocomplete="current-password" />
        </div>
        <div class="form-actions">
          <button class="btn" type="submit">Zaloguj</button>
        </div>
        <a class="btn btn-ghost admin-back admin-back--login" href="index.html#news">Wróć do strony</a>
        <p id="login-status" class="form-status" hidden></p>
      </form>
    </section>

    <section id="editor-panel" class="admin-editor" hidden aria-hidden="true">
      <div class="panel-inner admin-card">
        <h2 id="editor-title">Nowy post</h2>
        <form id="post-form" class="report-form" novalidate>
          <input type="hidden" id="post-id" name="id" value="" />
          <div class="field">
            <label for="post-date">Data</label>
            <input id="post-date" name="date" type="date" required />
          </div>
          <div class="field">
            <label for="post-title">Tytuł</label>
            <input id="post-title" name="title" type="text" required maxlength="160" />
          </div>
          <div class="field">
            <label for="post-body-editor">Treść</label>
            <div class="news-format-toolbar" role="toolbar" aria-label="Formatowanie tekstu">
              <button type="button" class="news-format-btn" data-format="bold" title="Pogrubienie">
                <strong>B</strong>
              </button>
              <button type="button" class="news-format-btn" data-format="italic" title="Kursywa">
                <em>I</em>
              </button>
              <button type="button" class="news-format-btn" data-format="underline" title="Podkreślenie">
                <span class="news-format-underline">U</span>
              </button>
              <span class="news-format-size-group" title="Rozmiar czcionki">
                <span class="news-format-size-box">
                  <span id="news-font-size-display" class="news-format-size-value">16</span>
                  <select id="news-font-size" class="news-format-size-select" aria-label="Rozmiar czcionki">
                    <option value="12">12</option>
                    <option value="14">14</option>
                    <option value="16" selected>16</option>
                    <option value="18">18</option>
                    <option value="20">20</option>
                    <option value="24">24</option>
                  </select>
                </span>
                <button
                  type="button"
                  class="news-format-btn news-format-size-step"
                  data-size-step="1"
                  title="Zwiększ rozmiar"
                  aria-label="Zwiększ rozmiar"
                >
                  <span class="news-format-size-ico">
                    A<span class="news-format-size-caret is-up" aria-hidden="true"></span>
                  </span>
                </button>
                <button
                  type="button"
                  class="news-format-btn news-format-size-step"
                  data-size-step="-1"
                  title="Zmniejsz rozmiar"
                  aria-label="Zmniejsz rozmiar"
                >
                  <span class="news-format-size-ico">
                    A<span class="news-format-size-caret is-down" aria-hidden="true"></span>
                  </span>
                </button>
              </span>
              <span class="news-format-color-wrap" title="Kolor tekstu">
                <span class="news-format-btn news-format-color" aria-hidden="true">
                  <span class="news-format-color-inner">
                    <span class="news-format-color-mark">A</span>
                    <span id="news-text-color-swatch" class="news-format-color-swatch"></span>
                  </span>
                </span>
                <input
                  id="news-text-color"
                  class="news-format-color-input"
                  type="color"
                  value="#1a4a7a"
                  aria-label="Kolor tekstu"
                />
              </span>
              <span class="news-format-align-group" title="Wyrównanie tekstu">
                <button
                  type="button"
                  class="news-format-btn news-format-align-btn"
                  data-format="justify"
                  title="Wyjustuj"
                  aria-label="Wyjustuj"
                >
                  <svg class="news-format-align-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512" fill="currentColor" aria-hidden="true">
                    <path d="M448 64c0 17.7-14.3 32-32 32H32C14.3 96 0 81.7 0 64S14.3 32 32 32H416c17.7 0 32 14.3 32 32zm0 256c0 17.7-14.3 32-32 32H32c-17.7 0-32-14.3-32-32s14.3-32 32-32H416c17.7 0 32 14.3 32 32zM0 192c0-17.7 14.3-32 32-32H416c17.7 0 32 14.3 32 32s-14.3 32-32 32H32c-17.7 0-32-14.3-32-32zM448 448c0 17.7-14.3 32-32 32H32c-17.7 0-32-14.3-32-32s14.3-32 32-32H416c17.7 0 32 14.3 32 32z" />
                  </svg>
                </button>
                <button
                  type="button"
                  class="news-format-btn news-format-align-btn"
                  data-format="align-left"
                  title="Do lewej"
                  aria-label="Do lewej"
                >
                  <svg class="news-format-align-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512" fill="currentColor" aria-hidden="true">
                    <path d="M288 64c0 17.7-14.3 32-32 32H32C14.3 96 0 81.7 0 64S14.3 32 32 32H256c17.7 0 32 14.3 32 32zm0 256c0 17.7-14.3 32-32 32H32c-17.7 0-32-14.3-32-32s14.3-32 32-32H256c17.7 0 32 14.3 32 32zM0 192c0-17.7 14.3-32 32-32H416c17.7 0 32 14.3 32 32s-14.3 32-32 32H32c-17.7 0-32-14.3-32-32zM448 448c0 17.7-14.3 32-32 32H32c-17.7 0-32-14.3-32-32s14.3-32 32-32H416c17.7 0 32 14.3 32 32z" />
                  </svg>
                </button>
                <button
                  type="button"
                  class="news-format-btn news-format-align-btn"
                  data-format="align-center"
                  title="Do środka"
                  aria-label="Do środka"
                >
                  <svg class="news-format-align-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512" fill="currentColor" aria-hidden="true">
                    <path d="M352 64c0 17.7-14.3 32-32 32H128c-17.7 0-32-14.3-32-32s14.3-32 32-32H320c17.7 0 32 14.3 32 32zm96 128c0 17.7-14.3 32-32 32H32c-17.7 0-32-14.3-32-32s14.3-32 32-32H416c17.7 0 32 14.3 32 32zM0 448c0-17.7 14.3-32 32-32H416c17.7 0 32 14.3 32 32s-14.3 32-32 32H32c-17.7 0-32-14.3-32-32zM352 320c0 17.7-14.3 32-32 32H128c-17.7 0-32-14.3-32-32s14.3-32 32-32H320c17.7 0 32 14.3 32 32z" />
                  </svg>
                </button>
                <button
                  type="button"
                  class="news-format-btn news-format-align-btn"
                  data-format="align-right"
                  title="Do prawej"
                  aria-label="Do prawej"
                >
                  <svg class="news-format-align-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512" fill="currentColor" aria-hidden="true">
                    <path d="M448 64c0 17.7-14.3 32-32 32H192c-17.7 0-32-14.3-32-32s14.3-32 32-32H416c17.7 0 32 14.3 32 32zm0 256c0 17.7-14.3 32-32 32H192c-17.7 0-32-14.3-32-32s14.3-32 32-32H416c17.7 0 32 14.3 32 32zM0 192c0-17.7 14.3-32 32-32H416c17.7 0 32 14.3 32 32s-14.3 32-32 32H32c-17.7 0-32-14.3-32-32zM448 448c0 17.7-14.3 32-32 32H192c-17.7 0-32-14.3-32-32s14.3-32 32-32H416c17.7 0 32 14.3 32 32z" />
                  </svg>
                </button>
              </span>
              <button type="button" class="news-format-btn" data-format="clear" title="Wyczyść formatowanie">
                Wyczyść
              </button>
            </div>
            <div
              id="post-body-editor"
              class="news-body-editor"
              contenteditable="true"
              role="textbox"
              aria-multiline="true"
              aria-label="Treść posta"
            ></div>
            <textarea id="post-body" name="body" required maxlength="4000" hidden></textarea>
          </div>
          <div class="form-actions admin-actions">
            <button class="btn" type="submit" id="save-post-btn">Zapisz post</button>
            <button class="btn btn-ghost" type="button" id="reset-post-btn">Wyczyść formularz</button>
          </div>
          <p id="editor-status" class="form-status" hidden></p>
        </form>
      </div>

      <div class="panel-inner admin-card">
        <div class="admin-list-head">
          <h2>Opublikowane posty</h2>
          <button class="btn btn-ghost" type="button" id="reload-posts-btn">Odśwież</button>
        </div>
        <ul id="admin-posts" class="admin-posts"></ul>
        <nav class="news-pagination" id="admin-posts-pagination" aria-label="Strony opublikowanych postów" hidden></nav>
      </div>
    </section>

    <footer class="admin-footer">
      <p>Copyright © Spółka Wodna - Wodociągu Wiejskiego Wietrzno-Łęki Dukielskie</p>
    </footer>
  </main>

  <button type="button" class="scroll-top" id="scroll-top" aria-label="Wróć na górę strony" aria-hidden="true" tabindex="-1">
    <svg class="scroll-top-drop" viewBox="0 0 44 56" aria-hidden="true" focusable="false">
      <path
        class="scroll-top-drop-fill"
        d="M22 2.2C22 2.2 40 23.5 40 35.2c0 9.5-8.1 17.2-18 17.2S4 44.7 4 35.2C4 23.5 22 2.2 22 2.2Z"
      />
    </svg>
    <svg class="scroll-top-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path
        fill="none"
        stroke="currentColor"
        stroke-width="3.5"
        stroke-linecap="round"
        stroke-linejoin="round"
        d="M6.2 13.4 12 7.6l5.8 5.8"
      />
    </svg>
  </button>

  <script src="config.js?v=53"></script>
  <script src="n-7f4a9c2e.js?v=57"></script>
</body>
</html>
